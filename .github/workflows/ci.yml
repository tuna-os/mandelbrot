name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  # Supersede in-flight runs on a PR — only the newest push there matters.
  # Never on `main`: every push shares the ref, so back-to-back merges cancel
  # each other and the branch goes long stretches with no completed build.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: "Code checks (fmt, typos, deny, i18n)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Pinned, not floating `@nightly`. rustfmt.toml turns on unstable
      # options (wrap_comments, normalize_comments among them) whose output
      # is not stable between nightlies: on 2026-09-01 a new nightly re-wrapped
      # comments in 131 files nobody had touched, so this gate failed for every
      # PR and said nothing about any of them. RUSTFMT_TOOLCHAIN below makes
      # hooks/checks use this same toolchain rather than whatever `+nightly`
      # resolves to today. To bump: change both together and run
      # `cargo +<new> fmt --all` in the same commit.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly-2026-11-12
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: hooks/checks
      # Install the prebuilt binary rather than letting the checks tool build
      # it: compiling cargo-binstall from source on nightly currently fails
      # inside tokio, which has nothing to do with this repo.
      - uses: cargo-bins/cargo-binstall@v1.27.0
      - name: Run pre-commit checks
        env:
          RUSTFMT_TOOLCHAIN: nightly-2026-08-28
        run: |
          RUST_BACKTRACE=1 cargo run --manifest-path hooks/checks/Cargo.toml -- --verbose --force-install --cargo-binstall

  matrixrtc-conformance:
    name: "MatrixRTC conformance tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: matrixrtc
      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-llvm-cov
      # Formatting is enforced tree-wide by the checks job, which uses the
      # nightly rustfmt this repo's rustfmt.toml requires.
      - name: Clippy
        run: cargo clippy --manifest-path matrixrtc/Cargo.toml --all-targets -- -D warnings
      # The conformance tests, instrumented. Covers matrixrtc/src only
      # (cargo-llvm-cov skips tests/ and examples/) and, without the `livekit`
      # feature, not livekit_connection.rs.
      - name: Run conformance tests with coverage
        run: cargo llvm-cov --manifest-path matrixrtc/Cargo.toml --no-report
      - name: Coverage report
        run: |
          cargo llvm-cov report --manifest-path matrixrtc/Cargo.toml --lcov --output-path matrixrtc/lcov.info
          {
            echo '### MatrixRTC coverage'
            echo '```'
            cargo llvm-cov report --manifest-path matrixrtc/Cargo.toml
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: matrixrtc-coverage-lcov
          path: matrixrtc/lcov.info
          if-no-files-found: error
      # Regression floor, set just under the line coverage measured on the
      # newest stable rustc (89.90% on 1.100.0; 91.08% on 1.99.1, when this
      # gate was added, see #67). The figure moves with the compiler, so
      # re-measure before raising it.
      - name: Coverage threshold
        run: cargo llvm-cov report --manifest-path matrixrtc/Cargo.toml --fail-under-lines 89

  clippy:
    name: "Clippy (flatpak sandbox)"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install SDK extensions
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Sdk.Extension.rust-stable//26.08 org.freedesktop.Sdk.Extension.llvm22//26.08
      - name: Initialize flatpak build sandbox
        run: |
          flatpak-builder --keep-build-dirs --user --disable-rofiles-fuse \
            --stop-at=fractal flatpak_app org.tunaos.mandelbrot.json
      - name: Run clippy
        run: |
          echo "cargo clippy --workspace --all-targets -- -D warnings" | \
            flatpak-builder --disable-rofiles-fuse --build-shell=fractal \
            flatpak_app org.tunaos.mandelbrot.json
      # The root crate's unit tests. Nothing else in CI runs them: the flatpak
      # job does not pass --run-tests. Two things the sandbox does not provide
      # by itself: the compiled gresource bundles that
      # login::local_server::tests loads from the meson build dir, and a
      # display -- without one #[gtk::test] prints a GTK init panic and
      # reports "ok" without running its body, so serve a Broadway display.
      - name: Run tests
        run: |
          flatpak-builder --disable-rofiles-fuse --build-shell=fractal \
            flatpak_app org.tunaos.mandelbrot.json <<'EOF'
          set -e
          ninja -C "$FLATPAK_BUILDER_BUILDDIR/_flatpak_build" data/resources/resources.gresource src/ui-resources.gresource
          gtk4-broadwayd :5 >/dev/null 2>&1 &
          export GDK_BACKEND=broadway BROADWAY_DISPLAY=:5
          cargo test --workspace
          EOF

  flatpak:
    name: "Flatpak build + tests"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: Mandelbrot-Linux-CI.flatpak
          manifest-path: org.tunaos.mandelbrot.json
          cache-key: flatpak-builder-${{ github.sha }}
      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Mandelbrot-Linux-CI
          path: Mandelbrot-Linux-CI.flatpak
          retention-days: 7
          if-no-files-found: error

  # Installs the bundle the job above built and starts it, so a dependency or
  # runtime bump that still compiles but no longer launches (missing library
  # or schema, a startup panic, a GTK critical) cannot go green. Runs on the
  # bare runner rather than the flatpak container: it needs a Wayland
  # compositor (mutter, as upstream Fractal's UI tests use) that the
  # container image does not ship.
  flatpak-smoke:
    name: "Flatpak launch smoke test"
    needs: flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Mandelbrot-Linux-CI
      - name: Install flatpak and a headless compositor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak mutter dbus jq
          # bubblewrap needs unprivileged user namespaces, which Ubuntu's
          # AppArmor policy denies to unconfined programs by default.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Launch the bundle headless
        env:
          OUT: ${{ github.workspace }}/smoke-logs
        run: tests/gui/run-flatpak-smoke.sh Mandelbrot-Linux-CI.flatpak
      - name: Upload the smoke-test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-smoke-logs
          path: smoke-logs
          if-no-files-found: warn
          retention-days: 7
