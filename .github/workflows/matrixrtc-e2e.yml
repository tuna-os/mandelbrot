name: MatrixRTC e2e

# The MatrixRTC *conformance* tests (matrixrtc/tests/, including the
# Element-Call-derived scenarios in element_call_scenarios.rs) run on every PR
# from the `matrixrtc-conformance` job in ci.yml. They are pure logic and take
# seconds.
#
# This workflow runs the *harness* suite in tests/e2e/, which needs a live
# synapse + LiveKit + lk-jwt-service stack and a join_call binary built
# against libwebrtc. It is deliberately NOT a merge gate:
#
#   - the cold build of the `livekit` feature pulls libwebrtc and takes ~10
#     minutes even with a warm cargo cache,
#   - it pulls ~1.5 GB of container images,
#   - the media assertions depend on real SFU timing and are inherently
#     flakier than the unit suite,
#   - the federated variant runs two homeservers, two SFUs and two auth
#     services at once.
#
# UNVERIFIED PATH — read before trusting a red run. The harness was authored
# and exercised under **rootless podman + podman-compose** on a developer
# host. This workflow runs it under **docker compose on ubuntu-latest**,
# which nobody has executed yet. The first scheduled run is a shakeout, and
# the two known divergences to look for are:
#
#   - `nginx/nginx.conf` and `nginx/nginx-federated.conf` reach the host
#     gateway as `host.containers.internal`, which is podman's name for it;
#     Docker calls it `host.docker.internal`. Only the MatrixRTC proxy
#     `server` blocks use it, which the native clients do not go through, so
#     this may not bite — but it is the first thing to check.
#   - compose provider selection. This one did bite, on every scheduled run:
#     detection ranked podman ahead of docker on binary presence alone, and
#     ubuntu-latest ships a podman binary whose socket is never started, so
#     the harness picked `podman compose` and died on `up -d`. The `COMPOSE`
#     below was meant to override that, but `run-interop.sh` carried its own
#     inlined copy of the detection that ignored the variable. Every script
#     now honours a preset `COMPOSE`, and unpinned detection probes that a
#     provider can actually reach an engine rather than that it is on PATH.
#
# Runner requirements, and why a GitHub-hosted `ubuntu-latest` runner should
# be able to host this at all:
#
#   - LiveKit runs with `network_mode: host` and binds UDP 50100-50200 (plus
#     50300-50400 for the second SFU in the federated stack). GitHub-hosted
#     runners give the job full control of the VM's network namespace, so
#     host networking and arbitrary UDP ranges are available; there is no
#     port restriction to work around. This is the one thing that would force
#     a self-hosted runner on a locked-down executor, so it is called out
#     here.
#   - Docker is preinstalled on ubuntu-latest, so no container engine has to
#     be installed.
#   - All traffic is loopback: clients reach synapse on 127.0.0.1:8008, the
#     SFU on 127.0.0.1:7880 and the auth service on 127.0.0.1:6080.
#   - `run-huddle.sh` starts N `join_call` processes, each a ~250 MB binary
#     carrying libwebrtc. It is invoked with 5 below to match Element Call's
#     huddle spec; drop it to 3 if the standard runner cannot take it.
#
# The one scenario that cannot run here is Element Call interop
# (run-interop-ec.sh): it drives a headless Chromium against a published
# element-call image, which is a second ~1 GB pull plus Playwright browsers.
# It stays manual — see tests/e2e/CONFORMANCE.md.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which harness scripts to run"
        required: false
        default: all
        type: choice
        options: [all, interop, resilience, restricted-sfu, huddle, federation]
  # Every PR that can break a call: dependency bumps (Renovate's included —
  # its branches live in this repository, so they get a normal pull_request
  # run), the calling code on both sides of the crate boundary, the harness
  # itself and the Flatpak manifest that pins the media stack.
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "matrixrtc/**"
      - "src/session/call/**"
      - "src/session_view/call/**"
      - "tests/e2e/**"
      - "org.tunaos.mandelbrot.json"
      - ".github/workflows/matrixrtc-e2e.yml"
  schedule:
    # 04:17 UTC daily, offset off the hour to avoid the scheduling stampede.
    - cron: "17 4 * * *"

concurrency:
  group: matrixrtc-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  harness:
    name: "MatrixRTC e2e harness"
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUITE: ${{ github.event.inputs.suite || 'all' }}
      # ubuntu-latest ships podman without a working rootless backend for this
      # stack, and detection prefers podman. Force the provider that this
      # runner actually has; the harness derives the container engine it uses
      # for per-container operations from this, so it stays docker too, which
      # is what the pull and teardown steps below speak.
      COMPOSE: "docker compose"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: matrixrtc
          # The livekit feature dominates the build; keep it in its own cache
          # slot so the fast PR job's cache is not evicted by it.
          key: livekit
          # A red scenario is not a broken build: keep the ~10 minute
          # libwebrtc build cached even when a TEST step below fails.
          cache-on-failure: true

      # webrtc-sys compiles against Chromium's hermetic libc++, whose headers
      # require Clang 21 or newer. ubuntu-latest still defaults to Clang 18.
      - name: Install Clang 21
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: "21.1.8"
          env: true

      - name: Install build dependencies for libwebrtc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev jq libglib2.0-dev
          # webrtc-sys's build script pkg-configs glib-2.0/gio-2.0 (all from
          # libglib2.0-dev) and panics when they are missing. The flatpak
          # builds get them from the GNOME SDK; a bare ubuntu runner does not.

      - name: Build the join_call example
        id: build
        run: |
          cargo build --manifest-path matrixrtc/Cargo.toml \
            --features livekit --example join_call
          ls -l matrixrtc/target/debug/examples/join_call

      - name: Pull the container images
        id: pull
        working-directory: tests/e2e
        run: docker compose -f compose.yml -f compose-federated.yml pull -q

      # Every scenario runs whenever the binary and the images are there, even
      # after an earlier one failed: each script brings its own stack up and
      # tears it down, and a red TEST 4 must not hide whether 5 and 6 work.
      - name: TEST 1 — native <-> native interop
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.pull.outcome == 'success' && (env.SUITE == 'all' || env.SUITE == 'interop') }}
        working-directory: tests/e2e
        env:
          JOIN_CALL_BIN: ${{ github.workspace }}/matrixrtc/target/debug/examples/join_call
        run: ./run-interop.sh

      - name: TEST 3 — reconnect / resilience
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.pull.outcome == 'success' && (env.SUITE == 'all' || env.SUITE == 'resilience') }}
        working-directory: tests/e2e
        env:
          JOIN_CALL_BIN: ${{ github.workspace }}/matrixrtc/target/debug/examples/join_call
        run: ./run-resilience.sh

      - name: TEST 4 — restricted SFU / JWT behaviour
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.pull.outcome == 'success' && (env.SUITE == 'all' || env.SUITE == 'restricted-sfu') }}
        working-directory: tests/e2e
        env:
          JOIN_CALL_BIN: ${{ github.workspace }}/matrixrtc/target/debug/examples/join_call
        run: ./run-restricted-sfu.sh

      - name: TEST 5 — group call (huddle)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.pull.outcome == 'success' && (env.SUITE == 'all' || env.SUITE == 'huddle') }}
        working-directory: tests/e2e
        env:
          JOIN_CALL_BIN: ${{ github.workspace }}/matrixrtc/target/debug/examples/join_call
        run: ./run-huddle.sh 5

      - name: TEST 6 — federated call (two homeservers)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.pull.outcome == 'success' && (env.SUITE == 'all' || env.SUITE == 'federation') }}
        working-directory: tests/e2e
        env:
          JOIN_CALL_BIN: ${{ github.workspace }}/matrixrtc/target/debug/examples/join_call
        # Both orders, even when the first fails.
        run: |
          rc=0
          ./run-federation.sh remote-first || rc=1
          ./run-federation.sh local-first || rc=1
          exit "$rc"

      - name: Upload the evidence bundles
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrixrtc-e2e-logs
          path: tests/e2e/logs
          if-no-files-found: warn
          retention-days: 7

      - name: Tear the stack down
        if: ${{ always() }}
        working-directory: tests/e2e
        run: |
          docker compose -f compose.yml -f compose-federated.yml down -v || true
          docker system prune -af --volumes || true
