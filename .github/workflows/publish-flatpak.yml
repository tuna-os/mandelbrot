name: Build and Publish Flatpak OCI

# Build/publish body lives in tuna-os/.github's reusable publish-flatpak.yml
# (tunaos#1183 recommendation #2). This file just keeps mandelbrot's own
# trigger policy: releases go out on tags or on demand, deliberately not on
# every push to main (a publish run is a heavy flatpak build competing with
# CI for runners).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A `v*` tag also gets a GitHub Release, so a release is discoverable without
  # knowing the GHCR path. It runs only after `publish` succeeded, and creates
  # or updates the release, so re-running it for the same tag is safe. There
  # are no downloadable files (the reusable workflow's `attach-bundles` is
  # off): the notes record the immutable digest of each pushed OCI image.
  github-release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # gh release create/edit
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      # The architectures the reusable workflow builds by default (its
      # `archs` input, not overridden below). Keep in sync if that changes.
      ARCHS: x86_64 aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write release notes
        run: |
          set -euo pipefail
          version="${TAG#v}"
          pairs=()
          for arch in $ARCHS; do
            # The package is public; an anonymous pull token is enough.
            digest=$(skopeo inspect --format '{{.Digest}}' \
              "docker://ghcr.io/tuna-os/mandelbrot:${TAG}-${arch}")
            pairs+=("${arch}=${digest}")
          done
          python3 build-aux/release-notes.py notes "$version" "$TAG" "${pairs[@]}" > notes.md
          echo "RELEASE_TYPE=$(python3 build-aux/release-notes.py type "$version")" >> "$GITHUB_ENV"

      - name: Create or update the release
        run: |
          set -euo pipefail
          prerelease=false
          [ "$RELEASE_TYPE" = stable ] || prerelease=true
          title="Mandelbrot ${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$title" --notes-file notes.md \
              --prerelease="$prerelease"
          else
            gh release create "$TAG" --verify-tag --title "$title" --notes-file notes.md \
              --prerelease="$prerelease"
          fi

  publish:
    # The called workflow's jobs may only downgrade from this ceiling: its
    # `publish` job pushes to GHCR (packages: write) and its `release-bundles`
    # job uploads release assets (contents: write).
    permissions:
      contents: write
      packages: write
    # Pinned to a reviewed tuna-os/.github commit; Renovate bumps the digest.
    uses: tuna-os/.github/.github/workflows/publish-flatpak.yml@794ded942d9de91b886b1bc82c1f663bc36ba61d # main
    with:
      app-id: org.tunaos.mandelbrot
      manifest-path: org.tunaos.mandelbrot.json
      repo-name: tuna-os/mandelbrot
    # Only the secret the called workflow declares, not `secrets: inherit`.
    secrets:
      FLATPAK_INDEX_TOKEN: ${{ secrets.FLATPAK_INDEX_TOKEN }}
