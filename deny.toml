[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is unmaintained but used by dependencies of matrix-sdk" },
    { id = "RUSTSEC-2026-0247", reason = "bitmaps is unmaintained with no safe upgrade; it is a transitive dependency of imbl via matrix-sdk/eyeball-im" },
    { id = "RUSTSEC-2026-0253", reason = "lru 0.16.4 use-after-free in LruCache::pop() on a panicking Drop; fixed in 0.18.2, but rqrr 0.10.1 (latest, transitive via aperture for QR scanning) hard-pins lru = \"^0.16\" and cannot resolve past 0.16.x until rqrr releases a bump — see #61" },
    # imbl-sized-chunks 0.1.3: double free / use-after-free when an element's Drop panics.
    # Fixed in 0.2.0, which only imbl >=7 uses; imbl 6.1.0 (latest 6.x) pins ^0.1.3, and
    # matrix-sdk / matrix-sdk-ui / matrix-sdk-common 0.18 require imbl ^6.1. Reaching the fix
    # means bumping to matrix-sdk 0.19 (imbl 7.0.2, eyeball-im 0.9). Remove this entry with that bump.
    { id = "RUSTSEC-2026-0292", reason = "imbl-sized-chunks fix needs imbl 7, i.e. matrix-sdk 0.19; remove when bumping matrix-sdk" },
]

[bans]
multiple-versions = "allow"

# To check if a license if compatible with our GPL v3.0 license, see: https://www.gnu.org/licenses/license-list.html
# Keep list sorted alphabetically.
[licenses]
unused-allowed-license = "deny"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-git = "deny"
required-git-spec = "rev"
allow-git = [
    "https://github.com/ruma/ruma",
    "https://github.com/matrix-org/matrix-rust-sdk",
]
unused-allowed-source = "allow"
