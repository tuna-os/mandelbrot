[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is unmaintained but used by dependencies of matrix-sdk" },
    { id = "RUSTSEC-2026-0247", reason = "bitmaps is unmaintained with no safe upgrade; it is a transitive dependency of imbl via matrix-sdk/eyeball-im" },
    { id = "RUSTSEC-2026-0253", reason = "lru 0.16.4 use-after-free in LruCache::pop() on a panicking Drop; fixed in 0.18.2, but rqrr 0.10.1 (latest, transitive via aperture for QR scanning) hard-pins lru = \"^0.16\" and cannot resolve past 0.16.x until rqrr releases a bump — see #61" },
    # anymap2 0.13: unmaintained (informational, no vulnerability). Pulled in directly by
    # matrix-sdk (0.18 and 0.19 alike); there is no fixed release, only the anymap3 replacement,
    # which matrix-sdk has to adopt upstream.
    { id = "RUSTSEC-2026-0319", reason = "anymap2 is unmaintained but is a direct dependency of matrix-sdk with no upgrade available" },
    # zip 0.6: webrtc-sys-build (latest 0.3.19, via livekit) requires zip = "^0.6".
    # The zip fixes are only in >=9.0.0, which is outside that dependency's constraint.
    { id = "RUSTSEC-2026-0367", reason = "zip 0.6.6 is transitively required by webrtc-sys-build; the fix requires zip >=9.0.0, outside its ^0.6 constraint" },
    { id = "RUSTSEC-2026-0368", reason = "zip 0.6.6 is transitively required by webrtc-sys-build; the fix requires zip >=9.0.0, outside its ^0.6 constraint" },
    { id = "RUSTSEC-2026-0369", reason = "zip 0.6.6 is transitively required by webrtc-sys-build; the fix requires zip >=9.0.0, outside its ^0.6 constraint" },
    { crate = "zip@0.6.6", reason = "yanked; webrtc-sys-build (latest 0.3.19) still requires zip ^0.6, all of which is yanked" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5.11.0 is unmaintained; it is transitively required by zbus 5.15.0 through ashpd and oo7, and zbus 6 is a breaking migration with no safe upgrade available" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4.3.2 is unmaintained; it is transitively required by zbus 5.15.0, and zbus 6 is a breaking migration with no safe upgrade available" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5.11.0 is unmaintained; it is transitively required by zvariant 5.11.0, and zbus 6 is a breaking migration with no safe upgrade available" },
]

[bans]
multiple-versions = "allow"

# To check if a license if compatible with our GPL v3.0 license, see: https://www.gnu.org/licenses/license-list.html
# Keep list sorted alphabetically.
[licenses]
unused-allowed-license = "deny"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # Reached only under `--all-features`, via webpki-roots (0.26.11 through
    # tokio-tungstenite -> livekit-net, and 1.0.7 through reqwest). It is a data
    # license covering the bundled CA certificate set rather than code, and is
    # permissive with no copyleft reciprocity, so it is compatible with this
    # project's GPL-3.0-or-later.
    #
    # This entry and the `--all-features` audit in hooks/checks must stay
    # together: `unused-allowed-license = "deny"` above rejects this line on its
    # own (license-not-encountered), and widening the audit without it fails the
    # other way.
    "CDLA-Permissive-2.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-git = "deny"
required-git-spec = "rev"
allow-git = [
    "https://github.com/ruma/ruma",
    "https://github.com/matrix-org/matrix-rust-sdk",
]
unused-allowed-source = "allow"
