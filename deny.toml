[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is unmaintained but used by dependencies of matrix-sdk" },
    { id = "RUSTSEC-2026-0247", reason = "bitmaps is unmaintained with no safe upgrade; it is a transitive dependency of imbl via matrix-sdk/eyeball-im" },
    { id = "RUSTSEC-2026-0253", reason = "lru 0.16.4 use-after-free in LruCache::pop() on a panicking Drop; fixed in 0.18.2, but rqrr 0.10.1 (latest, transitive via aperture for QR scanning) hard-pins lru = \"^0.16\" and cannot resolve past 0.16.x until rqrr releases a bump — see #61" },
    { id = "RUSTSEC-2026-0292", reason = "imbl-sized-chunks 0.1.3 double-free/use-after-free on a panicking Drop, transitive via matrix-sdk-ui/eyeball-im -> imbl 6.1.0. Fixed in imbl-sized-chunks 0.2.0, which needs imbl >=7.0.0 (imbl 6.1.0 hard-pins imbl-sized-chunks = \"^0.1.3\"). The imbl 7.0.2 bump is a major version and its own transitive requirements were not verified against a resolved build in this environment — tracked, not yet applied." },
    { id = "RUSTSEC-2026-0285", reason = "rustls 0.23.40 accepts TLS 1.3 handshake messages across encryption-level boundaries (RFC 8446 §5.1); handshake transcript is still authenticated so this is not exploitable for handshake alteration. Fixed in rustls 0.23.45, which itself needs rustls-webpki >=0.103.14 (locked at 0.103.13) and aws-lc-rs >=1.18 (locked at 1.16.3) — a cascading bump not verified against a resolved build in this environment — tracked, not yet applied." },
]

[bans]
multiple-versions = "allow"

# To check if a license if compatible with our GPL v3.0 license, see: https://www.gnu.org/licenses/license-list.html
# Keep list sorted alphabetically.
[licenses]
unused-allowed-license = "deny"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[sources]
unknown-git = "deny"
required-git-spec = "rev"
allow-git = [
    "https://github.com/ruma/ruma",
    "https://github.com/matrix-org/matrix-rust-sdk",
]
unused-allowed-source = "allow"
